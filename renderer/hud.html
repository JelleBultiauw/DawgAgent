<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      html, body { margin: 0; background: transparent; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; -webkit-user-select: none; }
      .hud { position: absolute; inset: 6px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 16px; border-radius: 16px;
        background: rgba(24, 24, 23, 0.9); color: #f1f0ec; backdrop-filter: blur(20px); -webkit-app-region: drag;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #7aa2ff; box-shadow: 0 0 0 0 rgba(122,162,255,0.6); animation: pulse 1.6s infinite; flex: none; }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(122,162,255,0.55); } 70% { box-shadow: 0 0 0 9px rgba(122,162,255,0); } 100% { box-shadow: 0 0 0 0 rgba(122,162,255,0); } }
      .text { flex: 1; min-width: 0; }
      .title { font-weight: 600; font-size: 12.5px; }
      .sub { color: #b4b2ab; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      button { -webkit-app-region: no-drag; border: 0; border-radius: 10px; padding: 7px 11px; background: #e5484d; color: white; font: 600 12px -apple-system, sans-serif; cursor: pointer; }
      button:hover { background: #d13d42; }
      kbd { font: 11px -apple-system, sans-serif; opacity: 0.8; margin-left: 4px; }
    </style>
  </head>
  <body>
    <div class="hud">
      <span class="dot"></span>
      <div class="text">
        <div class="title">DawgAgent bestuurt je computer</div>
        <div class="sub" id="sub">Bezig…</div>
      </div>
      <button id="stop">Stop<kbd>⌘⇧⎋</kbd></button>
    </div>
    <script>
      window.orka.on('hud:update', (d) => { document.getElementById('sub').textContent = d.text || 'Bezig…'; });
      document.getElementById('stop').addEventListener('click', () => window.orka.invoke('chat:stopAll'));
    </script>
  </body>
</html>
